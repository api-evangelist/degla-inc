aid: degla-inc
name: Degla Inc
description: >-
  Degla is a Y Combinator (Fall 2026) startup building an autonomous aerial
  intelligence layer that turns natural language into multi-drone mission
  execution. Operators describe an objective in plain language and Degla plans
  the mission, assigns aircraft, defines coverage patterns, and deploys a fleet
  that adapts in real time — with no waypoints, flight plans, or specialized
  training required. The platform targets search and rescue, emergency response,
  infrastructure inspection, and other critical field operations. Founded in
  2026 by Aziz Hanafi and based in Boston, the company is in early access and
  has not yet published a public API, developer portal, or documentation.
